<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2a4a" />
    <meta
      name="description"
      content="دليل: اكتشف الأردن، خطط رحلتك واحجز تجارب محلية من مضيفين معتمدين."
    />
    <title>دليل | Daleel</title>
    <link rel="icon" href="/assets/avatar.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">انتقل للمحتوى / Skip to content</a>
    <header id="header"></header>
    <main id="main" class="main" tabindex="-1">
      <p class="loading" role="status">جارٍ التحميل… / Loading…</p>
    </main>
    <nav id="bottomNav" class="bottom-nav" aria-label="Mobile navigation"></nav>
    <footer id="footer" class="footer"></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      ><p>
        يلزم تفعيل JavaScript لاستخدام الحساب والحجوزات. / Enable JavaScript to
        use accounts and bookings.
      </p></noscript
    >
    <script type="module">
      import("/JS/app/app.js").catch(() => {
        document.getElementById("main").textContent =
          "تعذّر تحميل ملفات الموقع. تحقق من الإنترنت وأعد تحميل الصفحة. / Site files could not load. Check your connection and reload.";
      });
    </script>
  </body>
</html>
